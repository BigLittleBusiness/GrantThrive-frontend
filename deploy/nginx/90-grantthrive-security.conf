# Included from nginx.conf's http{} context by the BinaryLane deployment.
# Header policy applies to all GrantThrive virtual hosts on this server.

# Transport and browser protections. The policy permits the self-hosted SPA and
# Cloudflare Turnstile only; third-party script execution and embedded framing
# are not allowed.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https:; frame-src https://challenges.cloudflare.com; upgrade-insecure-requests" always;

# Cache fingerprinted Vite assets aggressively without caching application HTML.
map $uri $grantthrive_asset_cache_control {
    default "";
    ~*\.(?:js|mjs|css|woff2|png|jpe?g|gif|svg|webp|avif|ico)$ "public, max-age=31536000, immutable";
}
add_header Cache-Control $grantthrive_asset_cache_control always;

# BinaryLane already enables gzip globally. Compression directives deliberately
# remain in the host configuration, avoiding duplicate http-context directives.
